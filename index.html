<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manafith - Eid Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Noto+Sans+Arabic:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card-area" aria-live="polite">
        <div class="card-frame">
          <img
            id="previewImage"
            class="card-frame__image hidden"
            alt="معاينة التصميم"
          />
        </div>
      </section>

      <section class="control">
        <div class="control__header">
          <h1>اكتب اسمك</h1>          
        </div>

        <form id="nameForm" class="form" autocomplete="off">
          <label for="nameInput">الاسم</label>
          <input
            id="nameInput"
            name="name"
            type="text"
            minlength="1"
            maxlength="40"
            required
          />
          <p class="lede">
            الاسم يظهر مباشرة داخل التصميم ثم يمكنك تحميل الصورة.
          </p>
          <button id="generateButton" type="submit">تحميل الصورة</button>
        </form>

        <p id="statusMessage" class="status" role="status"></p>
      </section>
    </main>

    <canvas id="workCanvas" class="hidden" aria-hidden="true"></canvas>

    <script src="script.js" defer></script>
  </body>
</html>
